name: Deploy

# A merge into develop publishes to Play Internal App Sharing; a merge into main
# publishes to the closed "alpha" testing track. (A merged PR is a push to the
# target branch.)
on:
  push:
    branches: [develop, main]

# Never run two deploys for the same branch at once; newer push wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + tag on main via the GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the versionCode (commit count) is stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decrypt signing + service-account secrets
        env:
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}
        run: ./release/decrypt-secrets.sh

      - name: Compute versionCode
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB + APK
        env:
          ORG_GRADLE_PROJECT_CONTACTMANAGER_RELEASE_KEYSTORE_PWD: ${{ secrets.CONTACTMANAGER_RELEASE_KEYSTORE_PWD }}
          ORG_GRADLE_PROJECT_CONTACTMANAGER_RELEASE_KEY_PWD: ${{ secrets.CONTACTMANAGER_RELEASE_KEY_PWD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Upload build artifacts (AAB + APK + mapping)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-v${{ steps.version.outputs.code }}
          if-no-files-found: error
          retention-days: 90
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish to Internal App Sharing (develop)
        id: publish_ias
        if: github.ref == 'refs/heads/develop'
        run: bundle exec fastlane android internal_sharing

      - name: Publish to Closed Testing – alpha (main)
        if: github.ref == 'refs/heads/main'
        run: bundle exec fastlane android closed_testing

      # Tag the released version and cut a GitHub Release with the matching
      # CHANGELOG section as notes and the AAB/APK/mapping attached. Idempotent:
      # skips if the tag's release already exists.
      - name: Create GitHub release + tag (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'appVersionName\s*=\s*"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          # Release notes come from the gradle-changelog-plugin: this version's
          # section with the header and summary stripped.
          NOTES=$(./gradlew -q :app:getChangelog --no-header --no-summary || true)
          [ -z "$NOTES" ] && NOTES="Release $TAG"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG (build ${VERSION_CODE})" \
            --notes "$NOTES" \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/mapping/release/mapping.txt

      # Announce a successful publish to the team's Telegram topic. Only runs
      # when every prior step (including the branch's publish) succeeded.
      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Supergroup 3958527097; the Bot API addresses it with a -100 prefix.
          TELEGRAM_CHAT_ID: "-1003958527097"
          TELEGRAM_TOPIC_ID: "3"
          IAS_URL: ${{ steps.publish_ias.outputs.ias_url }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set"; exit 1
          fi

          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            TRACK="Internal App Sharing"
          else
            TRACK="Closed testing (alpha)"
          fi
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          TEXT=$(printf '\xE2\x9C\x85 ContactManager deployed\nTrack: %s\nVersion: 1.0 (build %s)\nBranch: %s @ %s\nBy: %s\nCommit: %s' \
            "$TRACK" "$VERSION_CODE" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR" "$COMMIT_SUBJECT")
          if [ -n "${IAS_URL:-}" ]; then
            TEXT=$(printf '%s\nInstall: %s' "$TEXT" "$IAS_URL")
          fi
          TEXT=$(printf '%s\nRun: %s' "$TEXT" "$RUN_URL")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "message_thread_id=${TELEGRAM_TOPIC_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null
